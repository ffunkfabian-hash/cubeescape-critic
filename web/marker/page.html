<title>Critic-Helm Markierbogen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: workshop bench - a grey studio stage holding the helmet, a narrow job sheet beside it (below on phones). */
  :root {
    --bg: #eceeef;
    --panel: #f7f8f8;
    --fg: #1c2023;
    --muted: #5b646a;
    --line: #d3d8db;
    --stage-hi: #a3a7aa;
    --stage-lo: #7c8084;
    --accent: #d27a1e;
    --accent-ink: #ffffff;
    --done: #1d8a80;
    --old: #8a9095;
    --draft: #ff5a36;
    --danger: #b3261e;
    --chip: #e3e7e9;
    --display: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "Barlow", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141719; --panel: #1b1f22; --fg: #e6e9eb; --muted: #9aa3a9; --line: #2d3337;
      --stage-hi: #74787c; --stage-lo: #4f5357; --accent: #f0a04b; --accent-ink: #1b1f22; --done: #3cc0b2;
      --old: #7d848a; --draft: #ff7a5c; --danger: #ff8a80; --chip: #262b2f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141719; --panel: #1b1f22; --fg: #e6e9eb; --muted: #9aa3a9; --line: #2d3337;
    --stage-hi: #74787c; --stage-lo: #4f5357; --accent: #f0a04b; --accent-ink: #1b1f22; --done: #3cc0b2;
    --old: #7d848a; --draft: #ff7a5c; --danger: #ff8a80; --chip: #262b2f; color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
  button, select, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mono { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }

  .app { display: grid; grid-template-columns: minmax(0, 1fr) 390px; height: 100%; }
  #stage {
    position: relative; overflow: hidden; min-height: 0;
    background: radial-gradient(120% 90% at 50% 35%, var(--stage-hi), var(--stage-lo));
  }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #stage[data-mode="stift"] canvas { cursor: crosshair; }
  #stage[data-mode="nadel"] canvas { cursor: grab; }

  .toolbar {
    position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: 12px; top: 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; pointer-events: none;
  }
  .toolbar > * { pointer-events: auto; }
  .seg { display: inline-flex; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 2px; backdrop-filter: blur(6px); flex-wrap: wrap; }
  .seg button { border: 0; background: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .02em; }
  .seg button:hover { background: var(--chip); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .seg .icon { display: inline-block; width: 1.1em; text-align: center; margin-right: 4px; }
  #ref-toggle { margin-left: auto; }

  #hint {
    position: absolute; left: 12px; bottom: 12px; right: 12px; margin: 0; max-width: 560px;
    font-size: 13px; color: #f4f5f5; text-shadow: 0 1px 2px rgb(0 0 0 / .5); pointer-events: none;
  }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 18px; color: #f4f5f5; }

  #pins { position: absolute; inset: 0; pointer-events: none; }
  .pin {
    position: absolute; transform: translate(-50%, calc(-100% - 4px)); pointer-events: auto; cursor: pointer;
    min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px 13px 13px 2px; border: 2px solid #fff;
    background: var(--accent); color: var(--accent-ink); font: 600 13px/22px var(--mono); box-shadow: 0 2px 6px rgb(0 0 0 / .35);
    transition: opacity .15s;
  }
  .pin::after { content: ""; position: absolute; left: -2px; bottom: -8px; width: 2px; height: 8px; background: #fff; }
  .pin.done { background: var(--done); color: #fff; }
  .pin.old { background: var(--old); color: #fff; }
  .pin.draft { background: var(--draft); color: #fff; }
  .pin.behind { opacity: .38; }
  .pin.sel { outline: 3px solid var(--fg); outline-offset: 1px; z-index: 2; }

  #refs {
    position: absolute; right: 12px; top: 56px; width: min(46%, 340px); display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px;
  }
  #refs figure { margin: 0; }
  #refs img { display: block; width: 100%; border-radius: 4px; }
  #refs figcaption { font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }

  aside {
    background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-width: 0;
    padding-block: 18px 28px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 18px;
  }
  header h1 { font: 600 24px/1.1 var(--display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
  header .sub { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; color: var(--muted); }
  #stand { color: var(--fg); border: 1px solid var(--line); padding: 1px 6px; border-radius: 4px; }
  #store-note { margin: 8px 0 0; font-size: 13px; color: var(--muted); }

  #form { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; background: var(--bg); }
  .form-head { display: flex; flex-direction: column; gap: 2px; }
  .form-head h2 { margin: 0; font: 600 18px var(--display); }
  .form-head .mono { color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field > span, legend { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  select, input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 7px 8px; min-width: 0; }
  textarea { resize: vertical; }
  .chips { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips legend { margin-bottom: 6px; padding: 0; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-weight: 500; }
  .actions button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .actions button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .actions.small button { padding: 4px 10px; font-size: 13px; }
  .error { color: var(--danger); margin: 0; font-size: 13px; }

  .list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .list-head h2 { margin: 0; font: 600 18px var(--display); }
  .list-head label { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .list-head input { width: auto; }
  #list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .item { border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  .item.sel { background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); }
  .item-main { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 0; background: none; padding: 2px; cursor: pointer; width: 100%; }
  .badge { flex: none; min-width: 26px; height: 26px; border-radius: 13px 13px 13px 2px; display: grid; place-items: center; font: 600 13px var(--mono); color: #fff; background: var(--accent); }
  .badge.umgesetzt { background: var(--done); }
  .badge.old { background: var(--old); }
  .item-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .satz { overflow-wrap: anywhere; }
  .meta { color: var(--muted); }
  .antwort, .note { margin: 0 0 0 36px; font-size: 13px; overflow-wrap: anywhere; }
  .antwort { border-left: 2px solid var(--done); padding-left: 8px; }
  .note { color: var(--muted); }
  .item .actions { margin-left: 36px; }
  .empty { color: var(--muted); padding: 6px 2px; }
  footer { margin-top: auto; font-size: 12px; color: var(--muted); }

  @media (max-width: 820px) {
    html, body { height: auto; }
    .app { grid-template-columns: 1fr; height: auto; }
    #stage { height: 62vh; min-height: 340px; }
    aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    #refs { width: calc(100% - 24px); top: auto; bottom: 44px; }
  }
  @media (prefers-reduced-motion: reduce) { .pin { transition: none; } }
</style>

<div class="app">
  <section id="stage" aria-label="Helm in 3D">
    <div id="pins"></div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Werkzeug">
        <button type="button" data-mode="nadel" aria-pressed="true"><span class="icon" aria-hidden="true">⌖</span>Nadel</button>
        <button type="button" data-mode="stift" aria-pressed="false"><span class="icon" aria-hidden="true">✎</span>Stift</button>
      </div>
      <div class="seg" id="views" role="group" aria-label="Ansicht"></div>
      <div class="seg"><button type="button" id="ref-toggle" aria-pressed="false">Vorlage</button></div>
    </div>
    <div id="refs" hidden></div>
    <p id="loading">Helm wird geladen …</p>
    <p id="hint"></p>
  </section>

  <aside>
    <header>
      <h1>Critic-Helm Markierbogen</h1>
      <div class="sub"><span id="stand" class="mono">Stand –</span><span id="count" class="mono"></span></div>
      <p id="store-note" hidden></p>
    </header>

    <div id="form" hidden></div>

    <section>
      <div class="list-head">
        <h2>Marker</h2>
        <label for="show-done"><input type="checkbox" id="show-done" checked> Umgesetzte zeigen</label>
      </div>
      <ul id="list"></ul>
    </section>

    <footer>
      Jeder Marker beschreibt eine Änderung an einem Teil (Kennungen wie in der Teilekarte: H01–H21, B01–B58).
      Seite A liegt im Frontbild links, Seite B rechts. Claude liest die offenen Marker, ändert den Generator und antwortet hier.
    </footer>
  </aside>
</div>

<script type="module" src="marker.js"></script>
