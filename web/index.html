<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Roboter-Viewer</title>
    <style>
      /* Layout (0.20): bar on top, panel "Modell" left, panel "Look" right; each panel folds away (body.left-closed / right-closed) */
      :root { --top: 52px; --left: 288px; --right: 300px; --bg: #1c2328; --line: #2c363c; --tile: #263035; --accent: #2f8f88; --accent-2: #8cddd4; }
      body.left-closed { --left: 0px; } body.right-closed { --right: 0px; }
      body.noui { --top: 0px; --left: 0px; --right: 0px; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8c8c8c; font: 13px/1.3 system-ui, sans-serif; }
      #app { position: fixed; inset: var(--top) var(--right) 0 var(--left); }
      #app canvas { display: block; width: 100%; height: 100%; }
      #overlay {
        position: fixed; top: var(--top); left: calc(var(--left) + (100vw - var(--left) - var(--right)) / 2); height: calc(100% - var(--top));
        transform: translateX(-50%); opacity: 0.45; pointer-events: none; display: none;
      }
      #overlay.diff { opacity: 1; mix-blend-mode: difference; }
      #assembly-labels { position:fixed;inset:var(--top) var(--right) 0 var(--left);pointer-events:none;color:#ecf1f3; }
      #assembly-labels[hidden], #assembly-parts[hidden] { display:none; }
      #assembly-labels svg { position:absolute;width:100%;height:100%; }
      #assembly-labels path { fill:none;stroke:#d8e3e8;stroke-width:1;opacity:.65; }
      #assembly-labels circle { fill:#effaff; }
      .assembly-label { position:absolute;display:flex;gap:7px;align-items:center;background:#1e292fe8;border-radius:4px;padding:5px 7px;box-sizing:border-box;font-size:11px;line-height:14px; }
      .assembly-label b { color:#8cddd4;min-width:34px; }
      .assembly-label span { overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
      .assembly-heading { position:absolute;top:18px;left:20px;font-weight:650;letter-spacing:.1em;font-size:13px;color:#202d33; }
      .assembly-footnote { position:absolute;bottom:12px;left:20px;right:20px;text-align:center;font-size:10px;color:#26363c; }
      #assembly-parts { position:fixed;inset:calc(var(--top) + 20px) auto 80px calc(var(--left) + 20px);width:min(440px,calc(100% - 40px));overflow:auto;box-sizing:border-box;padding:20px;background:#f3f5f6f5;border:1px solid #637881;border-radius:12px;color:#20313b;z-index:5; }
      #assembly-parts details { padding:10px 0;border-bottom:1px solid #c6d0d4; }
      #assembly-parts summary { cursor:pointer;font-weight:600; }
      #assembly-parts p,#assembly-parts li { font-size:12px;overflow-wrap:anywhere; }
      body.noui .lil-gui, body.noui #navbar, body.noui .nav-panel { display: none; }
      body:not(.noui)::before { content: ''; position: fixed; inset: 0 0 auto 0; height: var(--top); background: var(--bg); } /* bar while main.js loads */

      /* bar */
      #navbar { position: fixed; inset: 0 0 auto 0; height: var(--top); box-sizing: border-box; display: flex; align-items: center; gap: 10px;
        padding: 0 10px; background: var(--bg); color: #dfe7ea; border-bottom: 1px solid #0d1114; z-index: 5; }
      .nav-brand { letter-spacing: .06em; font-size: 13px; white-space: nowrap; margin-right: 6px; }
      .nav-title { flex: 1; min-width: 0; text-align: center; color: #c9d5d9; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .nav-views { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: #12181b; }
      #navbar button { font: inherit; color: #9fb0b7; background: transparent; border: 0; border-radius: 7px; padding: 6px; cursor: pointer; display: grid; place-items: center; }
      #navbar button:hover { background: #2a3439; color: #dfe7ea; }
      #navbar button.on { background: var(--accent); color: #fff; }
      @media (max-width: 900px) { .nav-brand { display: none; } }

      /* panels */
      .nav-panel { position: fixed; top: var(--top); bottom: 0; display: flex; flex-direction: column; box-sizing: border-box;
        background: var(--bg); color: #dfe7ea; z-index: 4; }
      #nav-left { left: 0; width: var(--left); border-right: 1px solid #0d1114; }
      #nav-right { right: 0; width: var(--right); border-left: 1px solid #0d1114; }
      body.left-closed #nav-left, body.right-closed #nav-right { display: none; }
      .nav-panel > header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--line);
        font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #9fb0b7; }
      .nav-panel button { font: inherit; color: inherit; background: #2a3439; border: 0; border-radius: 5px; padding: 5px 8px; cursor: pointer; }
      .nav-panel button:hover { background: #36444b; }
      .nav-panel button.on { background: var(--accent); color: #fff; }
      .nav-panel .nav-close { background: transparent; color: #8fa1a8; padding: 2px 6px; }
      .nav-body { flex: 1; overflow-y: auto; padding: 0 0 12px; scrollbar-width: thin; }
      .nav-panel > footer { padding: 7px 12px; border-top: 1px solid var(--line); font-size: 11px; color: #9fb0b7; display: flex; justify-content: space-between; gap: 8px; }
      .nav-panel > footer:empty { display: none; }
      .nav-section { border-bottom: 1px solid var(--line); padding: 2px 12px 10px; }
      .nav-section > summary { cursor: pointer; padding: 9px 0 6px; font-weight: 650; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-2); }
      .nav-group { margin: 10px 0 5px; font-size: 11px; color: #8fa1a8; text-transform: uppercase; letter-spacing: .05em; }

      /* picture tiles */
      .nav-tiles { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 6px; margin: 4px 0 6px; }
      .nav-panel .nav-tile { position: relative; display: flex; flex-direction: column; padding: 0; overflow: hidden; border-radius: 8px;
        background: var(--tile); border: 1px solid #33424a; text-align: left; }
      .nav-panel .nav-tile:hover { border-color: #5d7480; background: var(--tile); }
      .nav-panel .nav-tile.on { border-color: var(--accent-2); box-shadow: 0 0 0 1px var(--accent-2); background: var(--tile); }
      a.nav-tile { text-decoration: none; color: inherit; }
      .nav-tile img, .nav-tile-fill { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
      .nav-tile-fill { display: grid; place-items: center; color: #8fa1a8; } .nav-tile-fill svg { width: 55%; height: 55%; }
      .nav-tile > span { flex: 1; display: flex; align-items: center; gap: 4px; padding: 4px 6px 5px; font-size: 11px; line-height: 1.15; color: #c9d5d9; hyphens: auto; }
      .nav-tiles[style*="--cols:4"] .nav-tile > span { font-size: 10px; padding: 3px 4px 4px; }
      .nav-tile.on > span { color: #fff; background: #23393a; }
      .nav-tile > b { position: absolute; top: 4px; left: 4px; padding: 1px 5px; border-radius: 4px; background: #12181bd0; font-size: 10px; color: var(--accent-2); }
      .nav-swatch { display: inline-block; flex: none; width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 1px #0008; }

      /* rows, switches */
      .nav-row { display: grid; grid-template-columns: 88px 1fr auto; align-items: center; gap: 6px; margin: 6px 0; }
      .nav-row label { color: #b4c3c8; font-size: 12px; }
      .nav-row input[type=range] { width: 100%; accent-color: var(--accent); }
      .nav-row output { font-variant-numeric: tabular-nums; font-size: 11px; color: #9fb0b7; min-width: 30px; text-align: right; }
      .nav-seg { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 3px; }
      .nav-buttons { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
      .nav-check { display: flex; gap: 8px; align-items: center; margin: 8px 0 4px; font-size: 12px; color: #b4c3c8; cursor: pointer; }
      .nav-check input { appearance: none; flex: none; width: 30px; height: 17px; margin: 0; border-radius: 9px; background: #36444b; position: relative; cursor: pointer; transition: background .15s; }
      .nav-check input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #dfe7ea; transition: transform .15s; }
      .nav-check input:checked { background: var(--accent); } .nav-check input:checked::after { transform: translateX(13px); }
      .nav-note { font-size: 11px; color: #8fa1a8; margin: 8px 0 0; }
      .nav-gui .lil-gui.root { --width: 100%; width: 100%; --background-color: transparent; --title-background-color: #2a3439; }

      /* part tree */
      .nav-filter { width: 100%; box-sizing: border-box; margin: 4px 0; padding: 5px 7px; border-radius: 5px; border: 1px solid #36444b; background: #12181b; color: #dfe7ea; }
      .nav-tree ul { list-style: none; margin: 0; padding: 0; }
      .nav-tree li { display: flex; align-items: center; gap: 3px; padding: 1px 0 1px calc(var(--depth) * 14px); }
      .nav-tree li.sel .nav-part { background: var(--accent); color: #fff; }
      .nav-tree li.dim { opacity: .3; }
      .nav-panel .nav-part { flex: 1; min-width: 0; display: flex; gap: 6px; text-align: left; background: transparent; padding: 3px 5px; }
      .nav-part b { color: var(--accent-2); } .nav-part span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .nav-panel .nav-icon, .nav-panel .nav-caret { background: transparent; padding: 2px 4px; color: #8fa1a8; }
      .nav-panel .nav-caret { width: 18px; }

      /* loading bar */
      #loading { position: fixed; top: var(--top); left: var(--left); right: var(--right); height: 3px; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .3s; }
      #loading.on { opacity: 1; }
      #loading .fill { height: 100%; transform-origin: left; transform: scaleX(0); transition: transform .3s ease-out;
        background: linear-gradient(90deg, #2f8f88, #8cddd4); box-shadow: 0 0 8px #8cddd4aa; }
      #loading .label { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 4px 11px; border-radius: 12px;
        background: #1c2328e6; color: #dfe7ea; font-size: 12px; white-space: nowrap; transition: opacity .3s; }
      #loading.done .label { opacity: 0; }
      #loading.failed .fill { background: #d9534f; box-shadow: none; }
      #loading.failed .label { background: #5a1f1fe6; white-space: normal; max-width: 70vw; }
      body.noui #loading { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading" class="on"><div class="fill"></div><span class="label">Lade Viewer …</span></div>
    <img id="overlay" alt="" />
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
