<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Sci-Fi Helm – Three.js</title>
    <style>
      :root { --nav: 300px; }
      body.nav-closed, body.noui { --nav: 0px; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8c8c8c; font: 13px/1.3 system-ui, sans-serif; }
      #app { position: fixed; inset: 0 0 0 var(--nav); }
      #app canvas { display: block; width: 100%; height: 100%; }
      #overlay {
        position: fixed; top: 0; left: calc(var(--nav) + (100vw - var(--nav)) / 2); height: 100%; transform: translateX(-50%);
        opacity: 0.45; pointer-events: none; display: none;
      }
      #overlay.diff { opacity: 1; mix-blend-mode: difference; }
      #bar {
        position: fixed; left: calc(var(--nav) + (100vw - var(--nav)) / 2); bottom: 16px; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 6px;
        justify-content: center; max-width: calc(100% - 32px); padding: 6px; border-radius: 10px; background: rgba(20, 20, 22, 0.55);
      }
      #bar button {
        border: 0; border-radius: 6px; padding: 7px 12px; color: #eee; background: rgba(255, 255, 255, 0.1); cursor: pointer;
      }
      #bar button:hover { background: rgba(255, 255, 255, 0.2); }
      #bar button.on { background: #2f8f88; }
      #bar .sep { width: 1px; background: rgba(255, 255, 255, 0.2); }
      #assembly-labels { position:fixed;inset:0 0 0 var(--nav);pointer-events:none;color:#ecf1f3; }
      #assembly-labels[hidden], #assembly-parts[hidden] { display:none; }
      #assembly-labels svg { position:absolute;width:100%;height:100%; }
      #assembly-labels path { fill:none;stroke:#d8e3e8;stroke-width:1;opacity:.65; }
      #assembly-labels circle { fill:#effaff; }
      .assembly-label { position:absolute;display:flex;gap:7px;align-items:center;background:#1e292fe8;border-radius:4px;padding:5px 7px;box-sizing:border-box;font-size:11px;line-height:14px; }
      .assembly-label b { color:#8cddd4;min-width:34px; }
      .assembly-label span { overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
      .assembly-heading { position:absolute;top:18px;left:20px;font-weight:650;letter-spacing:.1em;font-size:13px;color:#202d33; }
      .assembly-footnote { position:absolute;bottom:12px;left:20px;right:20px;text-align:center;font-size:10px;color:#26363c; }
      #assembly-parts { position:fixed;inset:20px auto 80px calc(var(--nav) + 20px);width:min(440px,calc(100% - 40px));overflow:auto;box-sizing:border-box;padding:20px;background:#f3f5f6f5;border:1px solid #637881;border-radius:12px;color:#20313b;z-index:5; }
      #assembly-parts details { padding:10px 0;border-bottom:1px solid #c6d0d4; }
      #assembly-parts summary { cursor:pointer;font-weight:600; }
      #assembly-parts p,#assembly-parts li { font-size:12px;overflow-wrap:anywhere; }
      body.noui #bar, body.noui .lil-gui, body.noui #nav, body.noui #nav-open { display: none; }
      body:not(.nav-closed) #bar, body:not(.nav-closed) #nav-open, body.nav-closed #nav { display: none; }
      #nav { position: fixed; inset: 0 auto 0 0; width: var(--nav); display: flex; flex-direction: column; box-sizing: border-box;
        background: #1c2328; color: #dfe7ea; border-right: 1px solid #0d1114; z-index: 4; }
      #nav header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #2c363c; }
      #nav header b { letter-spacing: .06em; font-size: 13px; }
      #nav button, #nav-open { font: inherit; color: inherit; background: #2a3439; border: 0; border-radius: 5px; padding: 5px 8px; cursor: pointer; }
      #nav button:hover, #nav-open:hover { background: #36444b; }
      #nav button.on { background: #2f8f88; color: #fff; }
      #nav-open { position: fixed; left: 10px; top: 10px; z-index: 4; color: #dfe7ea; background: #1c2328e6; padding: 7px 10px; }
      .nav-body { flex: 1; overflow-y: auto; padding: 4px 0 12px; }
      #nav footer { padding: 8px 12px; border-top: 1px solid #2c363c; font-size: 11px; color: #9fb0b7; display: flex; justify-content: space-between; gap: 8px; }
      .nav-section { border-bottom: 1px solid #2c363c; padding: 2px 12px 10px; }
      .nav-section > summary { cursor: pointer; padding: 8px 0 6px; font-weight: 650; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #8cddd4; }
      .nav-group { margin: 8px 0 3px; font-size: 11px; color: #8fa1a8; text-transform: uppercase; letter-spacing: .05em; }
      .nav-link { display: flex; justify-content: space-between; gap: 6px; padding: 5px 8px; border-radius: 5px; color: #dfe7ea; text-decoration: none; }
      .nav-link small { color: #8fa1a8; white-space: nowrap; }
      .nav-link:hover { background: #2a3439; }
      .nav-link.on { background: #2f8f88; color: #fff; } .nav-link.on small { color: #d9f3f0; }
      .nav-row { display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: 6px; margin: 6px 0; }
      .nav-row label { color: #b4c3c8; font-size: 12px; }
      .nav-row input[type=range] { width: 100%; accent-color: #2f8f88; }
      .nav-row output { font-variant-numeric: tabular-nums; font-size: 11px; color: #9fb0b7; min-width: 30px; text-align: right; }
      .nav-seg { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 3px; }
      .nav-buttons { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
      .nav-check { display: flex; gap: 6px; align-items: center; margin: 5px 0; font-size: 12px; color: #b4c3c8; }
      .nav-note { font-size: 11px; color: #8fa1a8; margin: 6px 0; }
      .nav-filter { width: 100%; box-sizing: border-box; margin: 4px 0; padding: 5px 7px; border-radius: 5px; border: 1px solid #36444b; background: #12181b; color: #dfe7ea; }
      .nav-tree ul { list-style: none; margin: 0; padding: 0; }
      .nav-tree li { display: flex; align-items: center; gap: 3px; padding: 1px 0 1px calc(var(--depth) * 14px); }
      .nav-tree li.sel .nav-part { background: #2f8f88; color: #fff; }
      .nav-tree li.dim { opacity: .3; }
      #nav .nav-part { flex: 1; min-width: 0; display: flex; gap: 6px; text-align: left; background: transparent; padding: 3px 5px; }
      .nav-part b { color: #8cddd4; } .nav-part span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #nav .nav-icon, #nav .nav-caret { background: transparent; padding: 2px 4px; color: #8fa1a8; }
      #nav .nav-caret { width: 18px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <img id="overlay" alt="" />
    <div id="bar">
      <button data-view="front">Front</button>
      <button data-view="left">Left</button>
      <button data-view="back">Back</button>
      <button data-view="right">Right</button>
      <button data-view="turntable">Turntable</button>
      <span class="sep"></span>
      <button id="btn-overlay" title="Taste O">Overlay</button>
      <button id="btn-export">GLB-Export</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
